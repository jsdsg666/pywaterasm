[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pywaterasm"
version = "1.0.0"
description = "Generate standalone activated-sludge model simulation scripts from .inwt definitions"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jsdsg666" }]
keywords = ["ASM", "activated sludge", "wastewater", "code generation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
sim = ["numpy>=1.23", "scipy>=1.9"]

[project.scripts]
pywaterasm = "pywaterasm.engine:main"

[project.urls]
Homepage = "https://github.com/jsdsg666/pywaterasm"
Repository = "https://github.com/jsdsg666/pywaterasm"
Issues = "https://github.com/jsdsg666/pywaterasm/issues"

[tool.setuptools]
packages = ["pywaterasm"]

[tool.setuptools.package-data]
pywaterasm = ["mapping.md"]